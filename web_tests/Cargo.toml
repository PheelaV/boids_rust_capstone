[package]
name = "web_tests"
version = "0.1.0"
edition = "2021"

[dependencies]
# Selenium WebDriver client for Rust
thirtyfour = "0.32"
# Async runtime
tokio = { version = "1.0", features = ["full"] }
# HTTP server for serving the web demo during tests
warp = "0.3"
# Utilities
serde_json = "1.0"

[dev-dependencies]
# For assertions and test utilities
assert_cmd = "2.0"
predicates = "3.0"
