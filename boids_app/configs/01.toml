# Normal flocking with natural physics (SI units)
# Based on 2normal_s.toml with new physics parameters
#
# World: 10m x 10m (1000x1000 px at 1px = 1cm)
# Max speed: ~1.2 m/s (4.3 km/h) - gentle flocking
# Sensory distance: 0.4m (40cm)

no_boids = 1024
sample_rate = 16
save = true
save_timestamp = true
dbscan_flock_clustering_on = true

# Window
init_width = 1000
init_height = 1000

# Behavior coefficients (NOT scaled - max_steering already handles SI conversion)
alignment_coefficient = 0.2
cohesion_coefficient = 0.1
separation_coefficient = 2.5
alignment_treshold_coefficient = 1.0
cohesion_treshold_coefficient = 0.8
separation_treshold_coefficient = 0.3

# Speed and steering (SI units: pixels/second, pixels/second²)
max_speed = 120.0
max_steering = 18.0

# Vision
field_of_vision = 280.0
sensory_distance = 40.0

# Wander
wander_on = false
wander_rate = 0.2
wander_radius = 5.2
wander_random = false
wander_distance = 21.5
wander_coefficient = 0.14

# Display
size = 5.0
agent_steering = true
rules_impl = false

# Physics: Natural motion
velocity_retention = 0.02  # % of velocity kept per second (0.02 = 2%, 0.9 = 90%)
forward_drive = 30.0
target_fps = 60.0
fixed_timestep = true

# SI Units: 1px = 1cm
meters_per_pixel = 0.01
