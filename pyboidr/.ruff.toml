line-length = 100
indent-width = 4
target-version = "py313"
unsafe-fixes = false
show-fixes = true
exclude = [".venv"]

[format]
indent-style = "space"
quote-style = "double"
skip-magic-trailing-comma = false
docstring-code-format = true
docstring-code-line-length = 72
preview = true

[lint]
select = [
    "E",     # Pycodestyle Error
    "F",     # Pyflakes
    "I",     # isort
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "C4",    # flake8-comprehensions
    "RUF",   # Ruff-specific rules
    "TD",    # flake8-todos
    "D",     # pydocstyle
    "PTH",   # flake8-use-pathlib (modern path handling)
    "ANN",   # flake8-annotations
    "PL",    # Pylint, code smells and refactorings
    "FURB",  # refurb, refactoring and modernization
    "TRY",   # tryceratops, try-except
]
ignore = [
    # these are discouraged to be used with the formatter
    "E111",     # formatter
    "E114",     # formatter
    "E117",     # formatter
    "D206",     # formatter
    "D300",     # formatter
    "TD003",    # missing-todo-link
    "D100",     # undocumented-public-module, declared optional
    "D104",     # undocumented-public-package
    "PLR2004",  # magic-value-comparison
    "PLR0912",  # too-many-branches
    "PLR0913",  # too-many-arguments
    "PLW2901",  # redefined-loop-name
    # we are using types for intelisense and documentation, we are not doing type-checking yet
    "ANN002",   # missing-type-args,
    "ANN003",   # missing-type-kwargs
    "PLC0415",  # import-outside-top-level, be sensible about this, use for lazy-loading and optional dependencies
    "TRY003",   # raise-vanilla-args, we do not always define a custom exception class
    "TRY301",   # raise-within-try
]
fixable = ["ALL"]
pydocstyle = { convention = "google" }

[lint.per-file-ignores]
"*test*.py" = [
    "ANN201",   # missing-return-type-undocumented-public-function
    "D101",     # undocumented-public-class
    "D107",     # undocumented-public-init
]

[lint.flake8-annotations]
allow-star-arg-any = true
mypy-init-return = true

[lint.isort]
known-first-party = ["pyboidr"]
