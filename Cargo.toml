[workspace]
members = [
    "boids_lib",
    "boids_app",
    "boids_wasm",
    "boids_app_web",
    "web_tests"
    # "boidr/src/rust"
]

exclude = [
    # "boids_lib",
    "rustwrapper/src/rust",
    "boidr/src/rust"
]

default-members = [
    "boids_lib",
    "boids_app"
]

resolver = "2"

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
panic = "abort"