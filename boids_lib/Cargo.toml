[package]
name = "boids_lib"
version = "0.1.0"
edition = "2021"

[[bench]]
name = "boids_lib"
harness = false

[[bench]]
name = "bench_group"
harness = false

[[bench]]
name = "bench_compare"
harness = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
approx = "0.5"
chrono = "0.4"
csv = "1.3"
glam = {version = "0.17", default-features = true}
linfa = "0.6"
linfa-clustering = "0.6"
linfa-datasets = {version = "0.6", features = ["generate"]}
ndarray = "0.15"
rand = "0.8"
rand_xoshiro = "0.6"
serde = {version = "1", features = ["derive"]}
serde_json = "1"
flat_spatial = "0.6"
once_cell = "1.20"
petal-clustering = "0.5"
petal-neighbors = "0.8"
linfa-nn = "0.6"
itertools = "0.13"
voronoice = "0.2"
thiserror = "2.0"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
rstest = "0.23"
