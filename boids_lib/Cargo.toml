[package]
name = "boids_lib"
version = "0.1.0"
edition = "2021"

[[bench]]
name = "boids_lib"
harness = false

[[bench]]
name = "bench_group"
harness = false

[[bench]]
name = "bench_compare"
harness = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
default = ["std", "clustering"]
std = []
clustering = ["linfa", "linfa-clustering", "linfa-datasets", "linfa-nn", "petal-clustering", "petal-neighbors"]
wasm = ["getrandom/js"]

[dependencies]
approx = "0.5"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "wasmbind"] }
csv = "1.3"
glam = {version = "0.17", default-features = true}
linfa = { version = "0.6", optional = true }
linfa-clustering = { version = "0.6", optional = true }
linfa-datasets = { version = "0.6", features = ["generate"], optional = true }
ndarray = "0.15"
rand = "0.8"
rand_xoshiro = "0.6"
serde = {version = "1", features = ["derive"]}
serde_json = "1"
flat_spatial = "0.6"
once_cell = "1.20"
petal-clustering = { version = "0.5", optional = true }
petal-neighbors = { version = "0.8", optional = true }
linfa-nn = { version = "0.6", optional = true }
itertools = "0.13"
voronoice = "0.2"
thiserror = "2.0"
getrandom = { version = "0.2", features = ["js"] }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
rstest = "0.23"
