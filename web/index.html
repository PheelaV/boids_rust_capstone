<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boids Simulation - WebAssembly Demo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #1a1a2e;
            color: #eee;
            overflow: hidden;
        }

        #container {
            display: flex;
            height: 100vh;
        }

        #canvas-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #16213e;
        }

        canvas {
            border: 2px solid #0f3460;
            background: #0a1929;
        }

        #controls {
            width: 300px;
            background: #16213e;
            padding: 20px;
            overflow-y: auto;
            border-left: 2px solid #0f3460;
        }

        h1 {
            font-size: 24px;
            margin-bottom: 20px;
            color: #e94560;
        }

        h2 {
            font-size: 18px;
            margin: 20px 0 10px 0;
            color: #53a8b6;
        }

        .control-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
            color: #aaa;
        }

        input[type="range"] {
            width: 100%;
            margin-bottom: 5px;
        }

        .value-display {
            text-align: right;
            font-size: 12px;
            color: #53a8b6;
        }

        button {
            width: 100%;
            padding: 10px;
            margin: 5px 0;
            background: #e94560;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.3s;
        }

        button:hover {
            background: #d63651;
        }

        button.toggle {
            background: #53a8b6;
        }

        button.toggle:hover {
            background: #4a96a3;
        }

        button.toggle.active {
            background: #0f3460;
        }

        .stats {
            background: #0f3460;
            padding: 10px;
            border-radius: 4px;
            margin-top: 10px;
            font-size: 12px;
        }

        .stats div {
            margin: 5px 0;
        }

        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 24px;
            color: #53a8b6;
        }

        .error {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #e94560;
            padding: 20px;
            border-radius: 8px;
            max-width: 500px;
        }
    </style>
</head>
<body>
    <div id="container">
        <div id="canvas-container">
            <div id="loading" class="loading">Loading WebAssembly...</div>
            <canvas id="canvas" width="800" height="600" style="display: none;"></canvas>
        </div>

        <div id="controls">
            <h1>Boids Simulation</h1>

            <div class="stats" id="stats">
                <div>Boids: <span id="boid-count">0</span></div>
                <div>FPS: <span id="fps">0</span></div>
                <div>Frame: <span id="frame">0</span></div>
            </div>

            <h2>Behaviors</h2>
            <button class="toggle active" id="toggle-separation">Separation: ON</button>
            <button class="toggle active" id="toggle-cohesion">Cohesion: ON</button>
            <button class="toggle active" id="toggle-alignment">Alignment: ON</button>
            <button class="toggle active" id="toggle-wander">Wander: ON</button>

            <h2>Parameters</h2>

            <div class="control-group">
                <label for="separation">Separation Coefficient</label>
                <input type="range" id="separation" min="0" max="5" step="0.1" value="1.5">
                <div class="value-display"><span id="separation-value">1.5</span></div>
            </div>

            <div class="control-group">
                <label for="cohesion">Cohesion Coefficient</label>
                <input type="range" id="cohesion" min="0" max="3" step="0.1" value="1.0">
                <div class="value-display"><span id="cohesion-value">1.0</span></div>
            </div>

            <div class="control-group">
                <label for="alignment">Alignment Coefficient</label>
                <input type="range" id="alignment" min="0" max="3" step="0.1" value="1.0">
                <div class="value-display"><span id="alignment-value">1.0</span></div>
            </div>

            <div class="control-group">
                <label for="max-speed">Max Speed</label>
                <input type="range" id="max-speed" min="1" max="10" step="0.5" value="4.0">
                <div class="value-display"><span id="max-speed-value">4.0</span></div>
            </div>

            <h2>Actions</h2>
            <button id="reset">Reset Simulation</button>
            <button id="pause">Pause</button>

            <div style="margin-top: 30px; font-size: 11px; color: #666;">
                <p>A WebAssembly-powered flocking simulation based on Craig Reynolds' Boids algorithm.</p>
                <p style="margin-top: 10px;">Use the controls to adjust behavior parameters and observe emergent flocking patterns.</p>
            </div>
        </div>
    </div>

    <script type="module" src="./main.js"></script>
</body>
</html>
